map $http_upgrade $connection_upgrade_kongstocks_staging {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name staging.kongstocks.com;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name staging.kongstocks.com;

    add_header X-Robots-Tag "noindex, nofollow" always;

    ssl_certificate /etc/letsencrypt/live/staging.kongstocks.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.kongstocks.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32m;

    location /wp-content/uploads/ {
        alias /opt/kongstocks/wp-content/uploads/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_kongstocks_staging;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
